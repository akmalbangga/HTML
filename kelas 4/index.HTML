
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login">

        <h1>Welcome Back</h1>
        <p>Login To Your Account</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email address"
                required
            >

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button
                    type="button"
                    id="togglePassword"
                >
                    Lihat
                </button>

            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="footer-text">

            <a href="#" id="forgot">
                Forget password?
            </a>

            <span>Don't have an account?</span>

            <br>

            <a href="signup.html">
            <b>Sign Up</b>
        </a>

        </div>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
